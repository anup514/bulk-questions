<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Add Content — SR Bulk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module" src="js/pages/add-content/index.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="app-header__inner">
            <a href="index.html" class="app-brand">SR Bulk</a>
            <nav class="app-nav">
                <a class="app-nav__link" href="index.html">Question Bank</a>
                <a class="app-nav__link is-active" href="add-question.html">Add Content</a>
                <a class="app-nav__link" href="distribution.html">Distribution</a>
            </nav>
            <div class="app-header__spacer"></div>
            <div class="app-header__actions">
                <button type="button" id="theme-toggle-btn" class="icon-btn" aria-label="Toggle theme">
                    <span id="dark-mode-icon" class="material-symbols-outlined">light_mode</span>
                </button>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div class="app-container" style="max-width:56rem">
            <div class="page-heading">
                <h1>Add content</h1>
                <p>Paste tagged MCQs and flashcards into the editor below, then import.</p>
                <div class="page-heading__links">
                    <a href="https://gemini.google.com/gem/1B01S4GusuFyyeP2ZtZT2Irjo-E03NIRg?usp=sharing" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                        <span class="material-symbols-outlined" style="font-size:1rem">auto_awesome</span>
                        Gemini converter
                    </a>
                    <span class="tooltip-wrap">
                        <span class="material-symbols-outlined" style="font-size:1.125rem;color:var(--clr-text-tertiary);cursor:help">info</span>
                        <span class="tooltip">Converts a question paper into the tagged format this editor expects.</span>
                    </span>
                </div>
            </div>

            <div class="editor-panel">
                <div class="editor-panel__bar">
                    <span class="editor-panel__label">Bulk input</span>
                    <div style="display:flex;align-items:center;gap:0.5rem">
                        <span class="editor-panel__label">⌘/Ctrl + Enter</span>
                        <button id="bulk-submit-btn" type="button" class="btn btn-primary">Import</button>
                    </div>
                </div>

                <div class="editor-toolbar">
                    <button type="button" data-md-before="**" data-md-after="**" data-md-placeholder="text" title="Bold" class="tool-btn"><strong>B</strong></button>
                    <button type="button" data-md-before="*" data-md-after="*" data-md-placeholder="text" title="Italic" class="tool-btn"><em>I</em></button>
                    <button type="button" data-md-prefix="- " title="Bullet list" class="tool-btn">•</button>
                    <button type="button" data-md-prefix="1. " title="Numbered list" class="tool-btn">1.</button>
                    <button type="button" data-md-before="```&#10;" data-md-after="&#10;```" data-md-placeholder="code" title="Code block" class="tool-btn">&lt;/&gt;</button>
                    <button type="button" data-md-before="&lt;sup&gt;" data-md-after="&lt;/sup&gt;" data-md-placeholder="2" title="Superscript" class="tool-btn">x²</button>
                    <button type="button" data-md-before="&lt;sub&gt;" data-md-after="&lt;/sub&gt;" data-md-placeholder="2" title="Subscript" class="tool-btn">x₂</button>
                    <button type="button" data-md-before="![](" data-md-after=")" data-md-placeholder="url" title="Image" class="tool-btn">img</button>
                    <button type="button" data-md-before="$" data-md-after="$" data-md-placeholder="x^2" title="Inline math" class="tool-btn">$x$</button>
                    <button type="button" data-md-before="$$&#10;" data-md-after="&#10;$$" data-md-placeholder="\frac{a}{b}" title="Display math" class="tool-btn">$$</button>
                    <button type="button" data-action="paste-plain" title="Paste as plain text" class="tool-btn">Paste plain</button>
                </div>

                <div id="raw-input-editor"></div>

                <div class="editor-panel__footer">
                    <button type="button" data-tag="[Q]" class="tool-btn tool-btn--tag">[Q]</button>
                    <button type="button" data-tag="[F]" class="tool-btn tool-btn--tag">[F]</button>
                    <button type="button" data-tag="[B]" class="tool-btn tool-btn--tag">[B]</button>
                    <button type="button" data-tag="[O1]" class="tool-btn tool-btn--tag">[O1]</button>
                    <button type="button" data-tag="[E]" class="tool-btn tool-btn--tag">[E]</button>
                    <button type="button" data-tag="[T]" class="tool-btn tool-btn--tag">[T]</button>
                    <button type="button" data-tag="[SUB]" class="tool-btn tool-btn--tag">[SUB]</button>
                    <button type="button" data-tag="[TOP]" class="tool-btn tool-btn--tag">[TOP]</button>
                    <button type="button" data-tag="[LEV]" class="tool-btn tool-btn--tag">[LEV]</button>
                    <button type="button" data-tag="[ANS]" class="tool-btn tool-btn--tag">[ANS]</button>
                    <button type="button" data-tag="[END]" class="tool-btn tool-btn--tag">[END]</button>
                    <span class="editor-toolbar__sep"></span>
                    <button id="bulk-import-btn" type="button" class="btn btn-primary">Import to database</button>
                    <button id="bulk-load-file-btn" type="button" title="Load question-bank-import.txt" class="btn btn-ghost">Load file</button>
                </div>
                <div id="bulk-import-message" class="hidden"></div>
            </div>
        </div>
    </main>
</body>
</html>
