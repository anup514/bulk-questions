<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script>
        // Init dark mode immediately to avoid FOUC
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <title>Question Bank — SR Bulk</title>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module" src="js/pages/question-bank/index.js"></script>
</head>

<body>
    <header class="app-header">
        <div class="app-header__inner">
            <a href="index.html" class="app-brand">SR Bulk</a>
            <nav class="app-nav">
                <a class="app-nav__link is-active" href="index.html">Question Bank</a>
                <a class="app-nav__link" href="add-question.html">Add Content</a>
            </nav>
            <div class="app-header__spacer"></div>
            <div class="app-header__actions">
                <label class="app-search">
                    <span class="material-symbols-outlined">search</span>
                    <input id="search-questions" type="search" placeholder="Search…" autocomplete="off" />
                </label>
                <button type="button" id="theme-toggle-btn" class="icon-btn" aria-label="Toggle theme">
                    <span id="dark-mode-icon" class="material-symbols-outlined">light_mode</span>
                </button>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div class="app-container">
            <div class="toolbar">
                <div class="segments">
                    <button id="view-mcq-btn" type="button" class="segments__btn is-active">MCQs</button>
                    <button id="view-flashcards-btn" type="button" class="segments__btn">Flashcards</button>
                </div>
                <div class="toolbar__end">
                    <span id="feed-count" class="feed-count" aria-live="polite"></span>
                </div>
            </div>

            <div id="mcq-filter-bar" class="filters">
                <select id="filter-level" class="filter-select">
                    <option value="">All levels</option>
                    <option value="easy">Basic</option>
                    <option value="medium">Intermediate</option>
                    <option value="hard">Advanced</option>
                </select>
                <select id="filter-subject" class="filter-select">
                    <option value="">All subjects</option>
                </select>
                <select id="filter-topic" class="filter-select" disabled>
                    <option value="">All topics</option>
                </select>
                <select id="filter-heading" class="filter-select" title="Filter by heading group">
                    <option value="">All headings</option>
                </select>
                <select id="filter-date" class="filter-select" title="Filter by a single day">
                    <option value="">All dates</option>
                </select>
                <span id="filter-date-range" class="filter-date-range">
                    <input type="date" id="filter-date-from" class="filter-date" aria-label="From date" title="From date" />
                    <span class="filter-date-sep" aria-hidden="true">–</span>
                    <input type="date" id="filter-date-to" class="filter-date" aria-label="To date" title="To date" />
                </span>
                <select id="filter-explanation" class="filter-select">
                    <option value="">All explanations</option>
                    <option value="empty">Missing explanation</option>
                    <option value="non-empty">Has explanation</option>
                </select>
                <button type="button" id="delete-all-questions-btn" class="btn btn-danger-ghost" title="Delete all questions">
                    <span class="material-symbols-outlined" style="font-size:1rem">delete</span>
                    Delete all
                </button>
            </div>

            <div id="question-feed"></div>
            <div id="question-feed-loading" class="state-message hidden">Loading questions…</div>
            <div id="question-feed-empty" class="state-message hidden">No questions yet. Add some from Add Content.</div>
            <div id="flashcard-feed" class="hidden"></div>
            <div id="flashcard-feed-loading" class="state-message hidden">Loading flashcards…</div>
            <div id="flashcard-feed-empty" class="state-message hidden">No flashcards yet. Add some from Add Content.</div>

            <template id="question-card-template">
                <div class="question-card content-card">
                    <div class="content-card__body">
                <div class="question-card-header">
                    <div class="question-card-header__main">
                        <div class="question-card-meta">
                            <span class="question-serial-badge badge badge-neutral">1.</span>
                            <span class="question-difficulty-badge badge badge-medium">Medium</span>
                            <span class="question-heading-tag badge badge-heading hidden"></span>
                            <span class="question-subject-tag badge badge-neutral hidden"></span>
                            <div class="question-topic-tags" style="display:flex;flex-wrap:wrap;gap:0.25rem"></div>
                        </div>
                        <div class="question-stem"></div>
                    </div>
                    <div class="card-actions">
                        <button type="button" class="edit-btn edit" title="Edit"><span class="material-symbols-outlined" style="font-size:1.125rem">edit</span></button>
                        <button type="button" class="clear-all-btn" title="Clear all explanations"><span class="material-symbols-outlined" style="font-size:1.125rem">clear_all</span></button>
                        <button type="button" class="delete-btn danger" title="Delete"><span class="material-symbols-outlined" style="font-size:1.125rem">delete</span></button>
                    </div>
                </div>
                        <div class="question-options"></div>
                    </div>
                </div>
            </template>
        </div>

        <aside id="pagination-rail" class="pagination-rail" aria-label="Page navigation">
            <div id="pagination-container" class="pagination pagination--vertical"></div>
        </aside>
    </main>
</body>

</html>
