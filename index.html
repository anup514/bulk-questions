    <script>
        function formatInlineMarkdown(str) {
            if (!str) return '';
            return str
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }

        function extractLatex(text) {
            var parts = [];
            var counter = 0;
            var PH = '\uFFFDLX';
            var processed = text;
            processed = processed.replace(/\$\$([\s\S]+?)\$\$/g, function(m, latex) {
                var ph = PH + (counter++) + '\uFFFD';
                parts.push({ ph: ph, latex: latex, display: true, original: m });
                return ph;
            });
            processed = processed.replace(/\$([^\$\n]+?)\$/g, function(m, latex) {
                var ph = PH + (counter++) + '\uFFFD';
                parts.push({ ph: ph, latex: latex, display: false, original: m });
                return ph;
            });
            return { text: processed, parts: parts };
        }

        function restoreLatex(html, parts) {
            for (var j = 0; j < parts.length; j++) {
                var part = parts[j];
                if (typeof katex !== 'undefined') {
                    try {
                        var rendered = katex.renderToString(part.latex, {
                            displayMode: part.display,
                            throwOnError: false
                        });
                        var dataAttr = part.original
                            .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                            .replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        var cls = part.display ? 'math-display' : 'math-inline';
                        html = html.split(part.ph).join(
                            '<span class="' + cls + '" data-latex="' + dataAttr + '">' + rendered + '</span>'
                        );
                        continue;
                    } catch(e) { /* fall through to raw */ }
                }
                html = html.split(part.ph).join(
                    part.original.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                );
            }
            return html;
        }

        function renderTextWithLatex(text) {
            if (!text) return '';
            var extracted = extractLatex(text);
            var html = extracted.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return restoreLatex(html, extracted.parts);
        }

        function detectListIndentUnit(lines) {
            var indents = [];
            for (var i = 0; i < lines.length; i++) {
                var match = lines[i].match(/^(\s*)(?:(?:\d+)\.|[-*])\s+/);
                if (match && match[1].length > 0) indents.push(match[1].length);
            }
            if (indents.length === 0) return 2;
            var min = Math.min.apply(null, indents);
            return min <= 2 ? 2 : min;
        }

        function parseFormattedLine(line, indentUnit) {
            var olMatch = line.match(/^(\s*)(\d+)\.\s+(.*)/);
            if (olMatch) {
                return {
                    type: 'ol',
                    depth: Math.floor(olMatch[1].replace(/\t/g, '  ').length / indentUnit),
                    num: olMatch[2],
                    content: olMatch[3]
                };
            }
            var ulMatch = line.match(/^(\s*)[-*]\s+(.*)/);
            if (ulMatch) {
                return {
                    type: 'ul',
                    depth: Math.floor(ulMatch[1].replace(/\t/g, '  ').length / indentUnit),
                    content: ulMatch[2]
                };
            }
            var trimmed = line.trim();
            if (trimmed === '') return { type: 'blank' };
            return { type: 'p', content: trimmed };
        }

        function normalizeListDepths(parsed) {
            var minDepth = Infinity;
            for (var i = 0; i < parsed.length; i++) {
                var line = parsed[i];
                if (line.type === 'ol' || line.type === 'ul') {
                    if (line.depth < minDepth) minDepth = line.depth;
                }
            }
            if (!isFinite(minDepth) || minDepth === 0) return parsed;
            return parsed.map(function(line) {
                if (line.type !== 'ol' && line.type !== 'ul') return line;
                return { type: line.type, depth: line.depth - minDepth, num: line.num, content: line.content };
            });
        }

        function renderListBlock(parsed, startIdx, baseDepth) {
            var html = '<div class="fmt-list">';
            var i = startIdx;
            while (i < parsed.length) {
                var line = parsed[i];
                if (line.type === 'p' || line.type === 'blank') break;
                if (line.depth < baseDepth) break;
                if (line.depth > baseDepth) break;

                if (line.type === 'ol') {
                    html += '<div class="fmt-list-item"><span class="fmt-list-num">' + line.num + '.</span><span>';
                } else {
                    html += '<div class="fmt-list-item"><span class="fmt-bullet">&bull;</span><span>';
                }
                if (line.content) html += formatInlineMarkdown(line.content);
                i++;
                if (i < parsed.length && (parsed[i].type === 'ol' || parsed[i].type === 'ul') && parsed[i].depth > baseDepth) {
                    var nested = renderListBlock(parsed, i, baseDepth + 1);
                    html += nested.html;
                    i = nested.nextIdx;
                }
                html += '</span></div>';
            }
            html += '</div>';
            return { html: html, nextIdx: i };
        }

        function renderFormattedText(text) {
            if (!text) return '';
            var extracted = extractLatex(text);
            var escaped = extracted.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            var lines = escaped.split(/\n/);
            var indentUnit = detectListIndentUnit(lines);
            var parsed = normalizeListDepths(lines.map(function(line) {
                return parseFormattedLine(line, indentUnit);
            }));
            var html = '';
            var i = 0;

            while (i < parsed.length) {
                var line = parsed[i];
                if (line.type === 'blank') {
                    i++;
                    continue;
                }
                if (line.type === 'p') {
                    html += '<div class="fmt-p">' + formatInlineMarkdown(line.content) + '</div>';
                    i++;
                    continue;
                }
                var block = renderListBlock(parsed, i, 0);
                if (block.nextIdx === i) {
                    html += '<div class="fmt-p">' + formatInlineMarkdown(line.content || '') + '</div>';
                    i++;
                    continue;
                }
                html += block.html;
                i = block.nextIdx;
            }
            return restoreLatex(html, extracted.parts);
        }
    </script>
</head>

<script>
    const PAGE_SIZE = 10;
    let questionBankState = { page: 0, totalCount: 0, searchDebounce: null };
    let activeView = 'mcq';

        const DIFFICULTY_LABELS = { easy: 'Basic', medium: 'Intermediate', hard: 'Advanced' };
    const DIFFICULTY_CLASSES = {
        easy: 'badge-easy',
        medium: 'badge-medium',
        hard: 'badge-hard'
    };

        let SUBJECTS_DATA = [];
        let TOPICS_DATA = [];

        async function initSubjectAndTopicFilters() {
            const subjectSelect = document.getElementById('filter-subject');
            const topicSelect = document.getElementById('filter-topic');
            if (!subjectSelect || !topicSelect) return;

            try {
                const [subjectsResp, topicsResp] = await Promise.all([
                    fetch('assets/subjects.json'),
                    fetch('assets/topics.json')
                ]);
                if (!subjectsResp.ok || !topicsResp.ok) throw new Error('Failed to load subject/topic data');
                SUBJECTS_DATA = await subjectsResp.json();
                TOPICS_DATA = await topicsResp.json();

                // Populate subjects dropdown
                subjectSelect.innerHTML = '';
                const defaultSub = document.createElement('option');
                defaultSub.value = '';
                defaultSub.textContent = 'All subjects';
                subjectSelect.appendChild(defaultSub);
                SUBJECTS_DATA.forEach(sub => {
                    const opt = document.createElement('option');
                    opt.value = String(sub.id);
                    opt.textContent = sub.name;
                    opt.setAttribute('data-name', sub.name);
                    subjectSelect.appendChild(opt);
                });

                // Reset topic dropdown
                resetTopicDropdown();

                subjectSelect.addEventListener('change', () => {
                    updateTopicDropdownForSubject();
                    questionBankState.page = 0;
                    refreshActiveView();
                });

                topicSelect.addEventListener('change', () => {
                    questionBankState.page = 0;
                    refreshActiveView();
                });
            } catch (e) {
                console.error('Error initializing subject/topic filters', e);
            }
        }

        function resetTopicDropdown() {
            const topicSelect = document.getElementById('filter-topic');
            if (!topicSelect) return;
            topicSelect.innerHTML = '';
            const defaultTopic = document.createElement('option');
            defaultTopic.value = '';
            defaultTopic.textContent = 'All topics';
            topicSelect.appendChild(defaultTopic);
            topicSelect.disabled = true;
        }

        function updateTopicDropdownForSubject() {
            const subjectSelect = document.getElementById('filter-subject');
            const topicSelect = document.getElementById('filter-topic');
            if (!subjectSelect || !topicSelect) return;

            const subjectId = parseInt(subjectSelect.value || '0', 10);
            topicSelect.innerHTML = '';
            const defaultTopic = document.createElement('option');
            defaultTopic.value = '';
            defaultTopic.textContent = 'All topics';
            topicSelect.appendChild(defaultTopic);

            if (!subjectId || !Array.isArray(TOPICS_DATA) || TOPICS_DATA.length === 0) {
                topicSelect.disabled = true;
                return;
            }

            TOPICS_DATA.filter(t => t.subject_tag_id === subjectId).forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.name;
                opt.textContent = t.name;
                topicSelect.appendChild(opt);
            });
            topicSelect.disabled = false;
        }

    async function loadQuestions() {
        const feed = document.getElementById('question-feed');
        const loading = document.getElementById('question-feed-loading');
        const empty = document.getElementById('question-feed-empty');
        feed.innerHTML = '';
        loading.classList.remove('hidden');
        empty.classList.add('hidden');

        if (!window.supabase) {
            loading.classList.add('hidden');
            empty.classList.remove('hidden');
            empty.textContent = 'Supabase not configured. Add your URL and anon key in js/config.js';
            return;
        }

        const level = document.getElementById('filter-level').value.trim();
        let subject = '';
        const subjectEl = document.getElementById('filter-subject');
        if (subjectEl) {
            const selected = subjectEl.options[subjectEl.selectedIndex];
            subject = selected ? (selected.getAttribute('data-name') || '').trim() : '';
        }
        const topic = document.getElementById('filter-topic').value.trim();
        const explanationFilter = document.getElementById('filter-explanation').value.trim();
        const search = (document.getElementById('search-questions') && document.getElementById('search-questions').value) ? document.getElementById('search-questions').value.trim() : '';
        const from = questionBankState.page * PAGE_SIZE;
        const to = from + PAGE_SIZE - 1;

        let questions = [];
        let qErr = null;
        let count = 0;
        const applyQuestionBaseFilters = (query) => {
            if (level) query = query.eq('difficulty', level);
            if (subject) query = query.eq('subject', subject);
            if (topic) query = query.contains('topics', [topic]);
            if (search) query = query.ilike('stem', '%' + search + '%');
            return query;
        };

        if (!explanationFilter) {
            let query = window.supabase.from('questions').select('*', { count: 'exact' }).order('index', { ascending: true, nullsFirst: false });
            query = applyQuestionBaseFilters(query);
            const result = await query.range(from, to);
            questions = result.data || [];
            qErr = result.error || null;
            count = result.count || 0;
        } else {
            // Explanation-filter mode uses option-level explanation presence per question.
            let allQQuery = window.supabase
                .from('questions')
                .select('id, index, stem, difficulty, subject, topics')
                .order('index', { ascending: true, nullsFirst: false });
            allQQuery = applyQuestionBaseFilters(allQQuery);
            const { data: allMatchingQuestions, error: allQErr } = await allQQuery;
            if (allQErr) {
                qErr = allQErr;
            } else {
                const allQuestions = allMatchingQuestions || [];
                if (allQuestions.length === 0) {
                    questions = [];
                    count = 0;
                } else {
                    const allIds = allQuestions.map(q => q.id);
                    const { data: optionsForAll, error: optionsFilterErr } = await window.supabase
                        .from('options')
                        .select('question_id, explanation')
                        .in('question_id', allIds);
                    if (optionsFilterErr) {
                        qErr = optionsFilterErr;
                    } else {
                        const hasNonEmptyExplanation = {};
                        (optionsForAll || []).forEach(opt => {
                            const exp = (opt.explanation || '').trim();
                            if (exp) hasNonEmptyExplanation[opt.question_id] = true;
                        });
                        const filteredQuestions = allQuestions.filter(q => {
                            const hasAny = hasNonEmptyExplanation[q.id] === true;
                            return explanationFilter === 'non-empty' ? hasAny : !hasAny;
                        });
                        count = filteredQuestions.length;
                        const totalPages = Math.max(1, Math.ceil(count / PAGE_SIZE));
                        if (questionBankState.page > totalPages - 1) questionBankState.page = totalPages - 1;
                        const start = questionBankState.page * PAGE_SIZE;
                        questions = filteredQuestions.slice(start, start + PAGE_SIZE);
                    }
                }
            }
        }

        loading.classList.add('hidden');
        if (qErr) {
            empty.classList.remove('hidden');
            empty.textContent = 'Error loading questions: ' + (qErr.message || 'Unknown error');
            return;
        }
        questionBankState.totalCount = count || 0;
        if (!questions || questions.length === 0) {
            empty.classList.remove('hidden');
            renderPagination();
            return;
        }

        const ids = questions.map(q => q.id);
        const { data: options, error: oErr } = await window.supabase.from('options').select('*').in('question_id', ids).order('option_letter');
        if (oErr) {
            empty.classList.remove('hidden');
            empty.textContent = 'Error loading options: ' + (oErr.message || 'Unknown error');
            return;
        }
        const optionsByQuestion = {};
        (options || []).forEach(opt => {
            if (!optionsByQuestion[opt.question_id]) optionsByQuestion[opt.question_id] = [];
            optionsByQuestion[opt.question_id].push(opt);
        });

        questions.forEach(q => {
            const card = renderQuestionCard(q, optionsByQuestion[q.id] || []);
            feed.appendChild(card);
        });
        renderPagination();
    }

    async function loadFlashcards() {
        const feed = document.getElementById('flashcard-feed');
        const loading = document.getElementById('flashcard-feed-loading');
        const empty = document.getElementById('flashcard-feed-empty');
        if (!feed || !loading || !empty) return;
        feed.innerHTML = '';
        loading.classList.remove('hidden');
        empty.classList.add('hidden');

        if (!window.supabase) {
            loading.classList.add('hidden');
            empty.classList.remove('hidden');
            empty.textContent = 'Supabase not configured. Add your URL and anon key in js/config.js';
            return;
        }

        const search = (document.getElementById('search-questions') && document.getElementById('search-questions').value)
            ? document.getElementById('search-questions').value.trim()
            : '';
        const explanationFilterEl = document.getElementById('filter-explanation');
        const explanationFilter = explanationFilterEl ? explanationFilterEl.value.trim() : '';
        let query = window.supabase.from('flashcards').select('*').order('created_at', { ascending: false });
        if (search) query = query.or('front.ilike.%' + search + '%,back.ilike.%' + search + '%,explanation.ilike.%' + search + '%');

        const { data, error } = await query;
        loading.classList.add('hidden');
        if (error) {
            empty.classList.remove('hidden');
            empty.textContent = 'Failed to load flashcards: ' + (error.message || JSON.stringify(error));
            return;
        }
        let rows = data || [];
        if (explanationFilter === 'non-empty') {
            rows = rows.filter(r => !!((r.explanation || r.explaination || '').trim()));
        } else if (explanationFilter === 'empty') {
            rows = rows.filter(r => !((r.explanation || r.explaination || '').trim()));
        }
        if (!rows.length) {
            empty.classList.remove('hidden');
            return;
        }
        rows.forEach((row, idx) => feed.appendChild(renderFlashcardCard(row, idx + 1)));
    }

    function renderFlashcardCard(card, idx) {
        const explanationText = (card.explanation || card.explaination || '').trim();
        const wrap = document.createElement('div');
        wrap.className = 'content-card';
        wrap.innerHTML =
            '<div class="content-card__body" style="display:flex;flex-direction:column;gap:1rem">' +
                '<div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">' +
                    '<span class="badge badge-neutral">Card ' + idx + '</span>' +
                    '<div class="card-actions">' +
                        '<button type="button" class="flashcard-edit-btn edit" title="Edit"><span class="material-symbols-outlined" style="font-size:1.125rem">edit</span></button>' +
                        '<button type="button" class="flashcard-delete-btn danger" title="Delete"><span class="material-symbols-outlined" style="font-size:1.125rem">delete</span></button>' +
                    '</div>' +
                '</div>' +
                '<div>' +
                    '<div style="font-size:0.6875rem;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;color:var(--clr-text-tertiary);margin-bottom:0.25rem">Front</div>' +
                    '<div class="flashcard-front-view" style="font-size:0.875rem;line-height:1.6;white-space:pre-wrap;word-break:break-word">' + renderTextWithLatex(card.front || '') + '</div>' +
                    '<textarea class="flashcard-front-input field-input hidden" style="min-height:4rem"></textarea>' +
                '</div>' +
                '<div>' +
                    '<div style="font-size:0.6875rem;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;color:var(--clr-text-tertiary);margin-bottom:0.25rem">Back</div>' +
                    '<div class="flashcard-back-view" style="font-size:0.875rem;line-height:1.6;white-space:pre-wrap;word-break:break-word">' + renderTextWithLatex(card.back || '') + '</div>' +
                    '<textarea class="flashcard-back-input field-input hidden" style="min-height:4rem"></textarea>' +
                '</div>' +
                '<div>' +
                    '<div style="font-size:0.6875rem;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;color:var(--clr-text-tertiary);margin-bottom:0.25rem">Explanation</div>' +
                    '<textarea class="flashcard-explanation-input field-input" style="min-height:4.5rem" placeholder="Add explanation…"></textarea>' +
                    '<div style="margin-top:0.5rem;display:flex;align-items:center;gap:0.5rem">' +
                        '<button type="button" class="flashcard-save-explanation-btn btn btn-primary">Save</button>' +
                        '<span class="flashcard-save-status" style="font-size:0.75rem;color:var(--clr-text-secondary)"></span>' +
                    '</div>' +
                    '<textarea class="flashcard-explanation-edit-input field-input hidden" style="margin-top:0.5rem;min-height:4.5rem"></textarea>' +
                '</div>' +
                '<div class="flashcard-edit-actions hidden" style="display:none;gap:0.5rem">' +
                    '<button type="button" class="flashcard-save-edit-btn btn btn-primary">Save changes</button>' +
                    '<button type="button" class="flashcard-cancel-edit-btn btn btn-ghost">Cancel</button>' +
                '</div>' +
            '</div>';

        const frontInput = wrap.querySelector('.flashcard-front-input');
        const backInput = wrap.querySelector('.flashcard-back-input');
        const frontView = wrap.querySelector('.flashcard-front-view');
        const backView = wrap.querySelector('.flashcard-back-view');
        const expInput = wrap.querySelector('.flashcard-explanation-input');
        const expEditInput = wrap.querySelector('.flashcard-explanation-edit-input');
        const saveExpBtn = wrap.querySelector('.flashcard-save-explanation-btn');
        const saveStatus = wrap.querySelector('.flashcard-save-status');
        const editBtn = wrap.querySelector('.flashcard-edit-btn');
        const deleteBtn = wrap.querySelector('.flashcard-delete-btn');
        const editActions = wrap.querySelector('.flashcard-edit-actions');
        const saveEditBtn = wrap.querySelector('.flashcard-save-edit-btn');
        const cancelEditBtn = wrap.querySelector('.flashcard-cancel-edit-btn');

        expInput.value = explanationText;
        expEditInput.value = explanationText;
        frontInput.value = card.front || '';
        backInput.value = card.back || '';

        saveExpBtn.addEventListener('click', async () => {
            if (!window.supabase) return;
            saveExpBtn.disabled = true;
            saveStatus.textContent = 'Saving...';
            const nextExplanation = (expInput.value || '').trim();
            const { error } = await window.supabase
                .from('flashcards')
                .update({ explanation: nextExplanation || null })
                .eq('id', card.id);
            saveExpBtn.disabled = false;
            if (error) {
                saveStatus.textContent = 'Failed to save';
                saveStatus.className = 'flashcard-save-status status-error';
            } else {
                card.explanation = nextExplanation || null;
                saveStatus.textContent = 'Saved';
                saveStatus.className = 'flashcard-save-status status-success';
                expEditInput.value = nextExplanation;
                setTimeout(() => {
                    if (saveStatus.textContent === 'Saved') saveStatus.textContent = '';
                }, 1200);
            }
        });

        editBtn.addEventListener('click', () => {
            frontView.classList.add('hidden');
            backView.classList.add('hidden');
            frontInput.classList.remove('hidden');
            backInput.classList.remove('hidden');
            expInput.classList.add('hidden');
            saveExpBtn.classList.add('hidden');
            expEditInput.classList.remove('hidden');
            editActions.classList.remove('hidden');
            editActions.style.display = 'flex';
            frontInput.focus();
        });

        cancelEditBtn.addEventListener('click', () => {
            frontInput.value = card.front || '';
            backInput.value = card.back || '';
            expEditInput.value = (card.explanation || card.explaination || '').trim();
            frontInput.classList.add('hidden');
            backInput.classList.add('hidden');
            frontView.classList.remove('hidden');
            backView.classList.remove('hidden');
            expEditInput.classList.add('hidden');
            expInput.classList.remove('hidden');
            saveExpBtn.classList.remove('hidden');
            editActions.classList.add('hidden');
            editActions.style.display = 'none';
        });

        saveEditBtn.addEventListener('click', async () => {
            if (!window.supabase) return;
            saveEditBtn.disabled = true;
            const nextFront = (frontInput.value || '').trim();
            const nextBack = (backInput.value || '').trim();
            const nextExp = (expEditInput.value || '').trim();
            if (!nextFront || !nextBack) {
                alert('Front and Back cannot be empty.');
                saveEditBtn.disabled = false;
                return;
            }
            const { error } = await window.supabase
                .from('flashcards')
                .update({
                    front: nextFront,
                    back: nextBack,
                    explanation: nextExp || null
                })
                .eq('id', card.id);
            saveEditBtn.disabled = false;
            if (error) {
                alert('Failed to save flashcard: ' + (error.message || JSON.stringify(error)));
                return;
            }
            card.front = nextFront;
            card.back = nextBack;
            card.explanation = nextExp || null;
            frontView.innerHTML = renderTextWithLatex(card.front);
            backView.innerHTML = renderTextWithLatex(card.back);
            expInput.value = nextExp;
            saveStatus.textContent = 'Saved';
            saveStatus.className = 'flashcard-save-status status-success';
            cancelEditBtn.click();
        });

        deleteBtn.addEventListener('click', async () => {
            if (!window.supabase) return;
            if (!confirm('Delete this flashcard permanently?')) return;
            deleteBtn.disabled = true;
            const { error } = await window.supabase.from('flashcards').delete().eq('id', card.id);
            if (error) {
                deleteBtn.disabled = false;
                alert('Failed to delete flashcard: ' + (error.message || JSON.stringify(error)));
                return;
            }
            wrap.remove();
        });

        return wrap;
    }

    function updateCorrectAnswerVisuals(card, letters, correctLetter) {
        letters.forEach(letter => {
            const wrap = card.querySelector('.option-wrapper[data-option-letter="' + letter + '"]');
            if (!wrap) return;
            const isCorrect = !!correctLetter && letter === correctLetter;
            wrap.className = 'option-wrapper option-row' + (isCorrect ? ' is-correct' : '');
            const letterEl = wrap.querySelector('.option-letter');
            if (letterEl) letterEl.className = 'option-letter';
            const optText = wrap.querySelector('.option-text');
            if (optText) {
                const hidden = optText.classList.contains('hidden');
                optText.className = hidden ? 'option-text hidden' : 'option-text';
            }
        });
    }

    function renderQuestionCard(question, opts) {
        const t = document.getElementById('question-card-template');
        const clone = t.content.cloneNode(true);
        const card = clone.querySelector('.question-card');
        const serialEl = card.querySelector('.question-serial-badge');
        if (serialEl && typeof question.index === 'number') {
            const n = (question.index || 0);
            serialEl.textContent = n.toString() + '.';
        }
        card.querySelector('.question-difficulty-badge').textContent = DIFFICULTY_LABELS[question.difficulty] || question.difficulty;
        card.querySelector('.question-difficulty-badge').className = 'question-difficulty-badge badge ' + (DIFFICULTY_CLASSES[question.difficulty] || DIFFICULTY_CLASSES.medium);
        const subjectTag = card.querySelector('.question-subject-tag');
        if (subjectTag) {
            const sub = (question.subject || '').trim();
            if (sub) {
                subjectTag.textContent = sub;
                subjectTag.className = 'question-subject-tag badge badge-neutral';
            }
        }
        const topicTagsEl = card.querySelector('.question-topic-tags');
        if (topicTagsEl) {
            const topics = Array.isArray(question.topics) ? question.topics : [];
            topics.forEach(t => {
                const tStr = (t || '').toString().trim();
                if (!tStr) return;
                const span = document.createElement('span');
                span.className = 'badge badge-topic';
                span.textContent = tStr;
                topicTagsEl.appendChild(span);
            });
        }
        const stemEl = card.querySelector('.question-stem');
        stemEl.classList.add('rendered-markdown');
        stemEl.innerHTML = renderFormattedText(question.stem || '');

        const actionsRow = document.createElement('div');
        actionsRow.className = 'question-inline-edit-actions hidden';
        actionsRow.style.cssText = 'display:none;flex-wrap:wrap;align-items:center;gap:0.5rem;margin-top:0.75rem';
        actionsRow.innerHTML =
            '<button type="button" class="save-inline-edit-btn btn btn-primary">Save</button>' +
            '<button type="button" class="cancel-inline-edit-btn btn btn-ghost">Cancel</button>' +
            '<span class="inline-edit-status" style="font-size:0.75rem;color:var(--clr-text-secondary)"></span>';

        const optionsGrid = card.querySelector('.question-options');
        const letters = ['A', 'B', 'C', 'D'];
        const optMap = {};
        (opts || []).forEach(o => { optMap[o.option_letter] = o; });

        letters.forEach(letter => {
            const o = optMap[letter] || {};
            const isCorrect = o.is_correct === true;

            const div = document.createElement('div');
            div.setAttribute('data-option-letter', letter);
            div.className = 'option-wrapper option-row' + (isCorrect ? ' is-correct' : '');
            const radioDisabled = !o.id ? ' disabled' : '';
            const radioChecked = isCorrect ? ' checked' : '';
            div.innerHTML =
                '<div class="option-row__meta">' +
                '<label class="correct-option-label" title="Mark correct">' +
                '<input type="radio" name="correct-answer-' + question.id + '" value="' + letter + '"' + radioChecked + radioDisabled + ' />' +
                '</label>' +
                '<div class="option-letter">' + letter + '</div>' +
                '</div>' +
                '<div class="option-content">' +
                '<div class="option-text">' + renderTextWithLatex(o.option_text || '') + '</div>' +
                '<div class="explanation-container" data-opt="' + letter + '"></div>' +
                '</div>';
            const expEl = div.querySelector('.explanation-container');
            expEl.classList.add('rendered-markdown');
            if (o.explanation) {
                expEl.innerHTML = renderFormattedText(o.explanation);
            } else if (o.id) {
                const ta = document.createElement('textarea');
                ta.className = 'option-exp-input';
                ta.rows = 2;
                ta.placeholder = 'Add explanation…';
                ta.setAttribute('data-option-id', o.id || '');
                expEl.appendChild(ta);
                function resizeExpTextarea() {
                    ta.style.height = 'auto';
                    ta.style.height = Math.max(ta.scrollHeight, 56) + 'px';
                }
                ta.addEventListener('input', resizeExpTextarea);
                ta.addEventListener('paste', () => setTimeout(resizeExpTextarea, 0));
                resizeExpTextarea();
            }

            const correctRadio = div.querySelector('input[type="radio"]');
            if (correctRadio && o.id) {
                correctRadio.addEventListener('change', async () => {
                    if (!correctRadio.checked) return;
                    const newLetter = correctRadio.value;
                    const previousCorrect = letters.find(l => optMap[l] && optMap[l].is_correct === true) || null;
                    const setRadioDisabledState = () => {
                        card.querySelectorAll('input[name="correct-answer-' + question.id + '"]').forEach(r => {
                            const L = r.value;
                            r.disabled = !optMap[L] || !optMap[L].id;
                        });
                    };
                    if (!window.supabase) {
                        alert('Supabase not configured.');
                        setRadioDisabledState();
                        if (previousCorrect) {
                            const pr = card.querySelector('input[name="correct-answer-' + question.id + '"][value="' + previousCorrect + '"]');
                            if (pr) pr.checked = true;
                        }
                        return;
                    }
                    card.querySelectorAll('input[name="correct-answer-' + question.id + '"]').forEach(r => { r.disabled = true; });
                    let err = null;
                    await Promise.all(letters.map(l => {
                        const row = optMap[l];
                        if (!row || !row.id) return Promise.resolve();
                        return window.supabase.from('options').update({ is_correct: l === newLetter }).eq('id', row.id).then(res => {
                            if (res.error) err = res.error;
                        });
                    }));
                    if (err) {
                        alert('Failed to update correct answer: ' + err.message);
                        letters.forEach(l => {
                            if (optMap[l]) optMap[l].is_correct = l === previousCorrect;
                        });
                        updateCorrectAnswerVisuals(card, letters, previousCorrect);
                        card.querySelectorAll('input[name="correct-answer-' + question.id + '"]').forEach(r => {
                            r.checked = previousCorrect ? r.value === previousCorrect : false;
                        });
                    } else {
                        letters.forEach(l => {
                            if (optMap[l]) optMap[l].is_correct = l === newLetter;
                        });
                        updateCorrectAnswerVisuals(card, letters, newLetter);
                    }
                    setRadioDisabledState();
                });
            }

            optionsGrid.appendChild(div);
        });

        let cardIsEditing = false;

        function exitInlineEdit() {
            cardIsEditing = false;
            actionsRow.classList.add('hidden');
            actionsRow.style.display = 'none';
            if (card.querySelectorAll('.option-exp-input').length === 0) saveAllWrapper.classList.add('hidden');
            else saveAllWrapper.classList.remove('hidden');
            const eb = card.querySelector('.edit-btn');
            if (eb) {
                eb.classList.remove('edit');
                eb.setAttribute('title', 'Edit question');
            }
            const stemTa = stemEl.querySelector('.question-stem-input');
            if (stemTa) stemTa.remove();
            letters.forEach(letter => {
                const wrap = card.querySelector('.option-wrapper[data-option-letter="' + letter + '"]');
                if (!wrap) return;
                const ota = wrap.querySelector('.question-option-input');
                if (ota) ota.remove();
                const eta = wrap.querySelector('.question-exp-input');
                if (eta) eta.remove();
                const span = wrap.querySelector('.option-text');
                if (span) span.classList.remove('hidden');
                const expEl = wrap.querySelector('.explanation-container');
                if (expEl) expEl.classList.remove('hidden');
            });
            stemEl.classList.add('rendered-markdown');
            stemEl.innerHTML = renderFormattedText(question.stem || '');
            letters.forEach(letter => {
                const wrap = card.querySelector('.option-wrapper[data-option-letter="' + letter + '"]');
                if (!wrap) return;
                const textEl = wrap.querySelector('.option-text');
                if (textEl) textEl.innerHTML = renderTextWithLatex((optMap[letter] && optMap[letter].option_text) || '');
                const expEl = wrap.querySelector('.explanation-container');
                const row = optMap[letter];
                if (!expEl) return;
                const exp = (row && row.explanation) || '';
                expEl.classList.add('rendered-markdown');
                if (exp) {
                    expEl.innerHTML = renderFormattedText(exp);
                } else if (row && row.id) {
                    expEl.innerHTML = '';
                    const ta = document.createElement('textarea');
                    ta.className = 'option-exp-input';
                    ta.rows = 2;
                    ta.placeholder = 'Add explanation…';
                    ta.setAttribute('data-option-id', row.id);
                    expEl.appendChild(ta);
                    function resizeExpTextarea() {
                        ta.style.height = 'auto';
                        ta.style.height = Math.max(ta.scrollHeight, 56) + 'px';
                    }
                    ta.addEventListener('input', resizeExpTextarea);
                    ta.addEventListener('paste', () => setTimeout(resizeExpTextarea, 0));
                    resizeExpTextarea();
                } else {
                    expEl.innerHTML = '';
                }
            });
            const cl = letters.find(l => optMap[l] && optMap[l].is_correct) || null;
            updateCorrectAnswerVisuals(card, letters, cl);
            const st = actionsRow.querySelector('.inline-edit-status');
            if (st) {
                st.textContent = '';
                st.className = 'inline-edit-status status-muted';
            }
        }

        function enterInlineEdit() {
            cardIsEditing = true;
            actionsRow.classList.remove('hidden');
            actionsRow.style.display = 'flex';
            saveAllWrapper.classList.add('hidden');
            const eb = card.querySelector('.edit-btn');
            if (eb) {
                eb.classList.add('edit');
                eb.setAttribute('title', 'Cancel editing');
            }
            stemEl.classList.remove('rendered-markdown');
            stemEl.innerHTML = '';
            const stemTa = document.createElement('textarea');
            stemTa.className = 'question-stem-input field-input';
            stemTa.style.minHeight = '7rem';
            stemTa.value = question.stem || '';
            stemEl.appendChild(stemTa);
            letters.forEach(letter => {
                const wrap = card.querySelector('.option-wrapper[data-option-letter="' + letter + '"]');
                if (!wrap) return;
                const span = wrap.querySelector('.option-text');
                if (!span || wrap.querySelector('.question-option-input')) return;
                span.classList.add('hidden');
                const o = optMap[letter] || {};
                const ota = document.createElement('textarea');
                ota.className = 'question-option-input field-input';
                ota.style.minHeight = '3rem';
                ota.value = o.option_text || '';
                ota.setAttribute('data-option-letter', letter);
                span.insertAdjacentElement('afterend', ota);

                const expEl = wrap.querySelector('.explanation-container');
                if (expEl) expEl.classList.add('hidden');

                const eta = document.createElement('textarea');
                eta.className = 'question-exp-input field-input';
                eta.style.minHeight = '4.5rem';
                eta.value = o.explanation || '';
                eta.setAttribute('data-option-letter', letter);
                eta.placeholder = 'Edit explanation for option ' + letter + '...';
                ota.insertAdjacentElement('afterend', eta);
            });
        }

        actionsRow.querySelector('.cancel-inline-edit-btn').addEventListener('click', () => exitInlineEdit());
        actionsRow.querySelector('.save-inline-edit-btn').addEventListener('click', async () => {
            const btn = actionsRow.querySelector('.save-inline-edit-btn');
            const status = actionsRow.querySelector('.inline-edit-status');
            if (!window.supabase) {
                status.textContent = 'Supabase not configured.';
                status.className = 'inline-edit-status status-error';
                return;
            }
            const stemTa = stemEl.querySelector('.question-stem-input');
            const newStem = stemTa ? stemTa.value : question.stem;
            btn.disabled = true;
            status.textContent = 'Saving...';
            status.className = 'inline-edit-status status-muted';
            const { error: qErr } = await window.supabase.from('questions').update({ stem: newStem }).eq('id', question.id);
            if (qErr) {
                status.textContent = 'Failed: ' + qErr.message;
                status.className = 'inline-edit-status status-error';
                btn.disabled = false;
                return;
            }
            question.stem = newStem;
            let optErr = null;
            await Promise.all(letters.map(async letter => {
                const wrap = card.querySelector('.option-wrapper[data-option-letter="' + letter + '"]');
                const ota = wrap && wrap.querySelector('.question-option-input');
                const eta = wrap && wrap.querySelector('.question-exp-input');
                const row = optMap[letter];
                if (!ota || !eta || !row || !row.id) return;
                const text = ota.value;
                const explanation = (eta.value || '').trim();
                const { error } = await window.supabase
                    .from('options')
                    .update({ option_text: text, explanation: explanation || null })
                    .eq('id', row.id);
                if (error) optErr = error;
                else {
                    row.option_text = text;
                    row.explanation = explanation || null;
                }
            }));
            btn.disabled = false;
            if (optErr) {
                alert('Stem saved, but an option failed to save: ' + optErr.message);
            }
            exitInlineEdit();
        });

        const saveAllWrapper = document.createElement('div');
        saveAllWrapper.className = 'save-all-explanations-wrapper';
        if (card.querySelectorAll('.option-exp-input').length === 0) saveAllWrapper.classList.add('hidden');
        saveAllWrapper.innerHTML =
            '<span class="save-all-status" style="font-size:0.75rem;color:var(--clr-text-secondary)"></span>' +
            '<button type="button" class="save-all-explanations-btn btn btn-primary">Save explanations</button>';
        const saveAllBtn = saveAllWrapper.querySelector('.save-all-explanations-btn');
        const saveAllStatus = saveAllWrapper.querySelector('.save-all-status');
        saveAllBtn.addEventListener('click', async () => {
            function parseTaggedExplanations(text) {
                const result = {};
                if (!text) return result;
                const regex = /\[O([1-4]*)\]\s*([\s\S]*?)(?=\[O[1-4]*\]|\s*$)/g;
                let m;
                while ((m = regex.exec(text)) !== null) {
                    const idx = parseInt(m[1], 10);
                    const body = (m[2] || '').trim();
                    if (idx >= 1 && idx <= 4 && body) {
                        result[idx] = body;
                    }
                }
                return result;
            }
            const inputs = card.querySelectorAll('.option-exp-input');
            // If any textarea contains [O1]...[O4] tags, split and distribute them
            let taggedMap = null;
            inputs.forEach(ta => {
                if (taggedMap) return;
                const raw = (ta.value || '');
                if (/\[O[1-4]\]/.test(raw)) {
                    taggedMap = parseTaggedExplanations(raw);
                }
            });
            if (taggedMap && Object.keys(taggedMap).length > 0) {
                const letters = ['A', 'B', 'C', 'D'];
                inputs.forEach(ta => {
                    const wrap = ta.closest('.option-wrapper');
                    const expCont = wrap ? wrap.querySelector('.explanation-container') : null;
                    const letter = expCont ? (expCont.getAttribute('data-opt') || '').toUpperCase() : '';
                    const idx = letters.indexOf(letter) + 1;
                    if (idx >= 1 && taggedMap[idx]) {
                        ta.value = taggedMap[idx];
                        ta.style.height = 'auto';
                        ta.style.height = Math.max(ta.scrollHeight, 72) + 'px';
                    }
                });
            }
            const toSave = [];
            inputs.forEach(ta => {
                const raw = (ta.value || '').trim();
                if (raw) toSave.push({ id: ta.getAttribute('data-option-id'), text: raw, textarea: ta });
            });
            if (toSave.length === 0) {
                saveAllStatus.textContent = 'Enter at least one explanation to save.';
                saveAllStatus.className = 'save-all-status status-error';
                return;
            }
            if (!window.supabase) {
                saveAllStatus.textContent = 'Supabase not configured.';
                saveAllStatus.className = 'save-all-status status-error';
                return;
            }
            saveAllBtn.disabled = true;
            saveAllStatus.textContent = 'Saving...';
            saveAllStatus.className = 'save-all-status status-muted';
            let failed = 0;
            await Promise.all(toSave.map(async ({ id, text, textarea }) => {
                const { error } = await window.supabase.from('options').update({ explanation: text }).eq('id', id);
                if (error) {
                    failed++;
                    return;
                }
                const optionLetter = (textarea.closest('.option-wrapper') && textarea.closest('.option-wrapper').querySelector('.explanation-container'))
                    ? (textarea.closest('.option-wrapper').querySelector('.explanation-container').getAttribute('data-opt') || '')
                    : '';
                if (optionLetter && optMap[optionLetter]) optMap[optionLetter].explanation = text;
                const expContainer = textarea.closest('.option-wrapper').querySelector('.explanation-container');
                if (expContainer) {
                    expContainer.innerHTML = renderFormattedText(text);
                    expContainer.classList.add('rendered-markdown');
                }
            }));
            saveAllBtn.disabled = false;
            if (failed > 0) {
                saveAllStatus.textContent = failed + ' explanation(s) failed to save.';
                saveAllStatus.className = 'save-all-status status-error';
            } else {
                saveAllStatus.textContent = toSave.length === 1 ? '1 explanation saved.' : toSave.length + ' explanations saved.';
                saveAllStatus.className = 'save-all-status status-ok';
                if (card.querySelectorAll('.option-exp-input').length === 0) saveAllWrapper.classList.add('hidden');
                setTimeout(() => { saveAllStatus.textContent = ''; }, 3000);
            }
        });
        card.querySelector('.content-card__body').appendChild(saveAllWrapper);
        card.querySelector('.content-card__body').appendChild(actionsRow);

        const editBtn = card.querySelector('.edit-btn');
        editBtn.addEventListener('click', () => {
            if (cardIsEditing) exitInlineEdit();
            else enterInlineEdit();
        });

        const deleteBtn = card.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', async () => {
            if (!confirm('Are you sure you want to delete this question? This cannot be undone.')) return;
            if (!window.supabase) return;

            deleteBtn.disabled = true;
            const { error: optErr } = await window.supabase.from('options').delete().eq('question_id', question.id);
            if (optErr) { alert('Failed to delete options: ' + optErr.message); deleteBtn.disabled = false; return; }
            const { error: qErr } = await window.supabase.from('questions').delete().eq('id', question.id);
            if (qErr) { alert('Failed to delete question: ' + qErr.message); deleteBtn.disabled = false; return; }

            card.style.transition = 'opacity 0.3s, transform 0.3s';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            setTimeout(() => { card.remove(); questionBankState.totalCount--; renderPagination(); }, 300);
        });

        return card;
    }

    function renderPagination() {
        const container = document.getElementById('pagination-container');
        container.innerHTML = '';
        const totalPages = Math.max(1, Math.ceil(questionBankState.totalCount / PAGE_SIZE));
        const page = questionBankState.page;

        const prev = document.createElement('button');
        prev.type = 'button';
        prev.className = 'pagination__btn';
        prev.innerHTML = '<span class="material-symbols-outlined" style="font-size:1.125rem">expand_less</span>';
        prev.title = 'Previous page';
        prev.disabled = page === 0;
        prev.addEventListener('click', () => { questionBankState.page = Math.max(0, page - 1); loadQuestions(); });
        container.appendChild(prev);

        function addPageButton(i) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'pagination__btn' + (i === page ? ' is-active' : '');
            btn.textContent = i + 1;
            btn.title = 'Page ' + (i + 1);
            btn.addEventListener('click', () => { questionBankState.page = i; loadQuestions(); });
            container.appendChild(btn);
        }

        function addEllipsis() {
            const dots = document.createElement('span');
            dots.className = 'pagination__ellipsis';
            dots.textContent = '…';
            container.appendChild(dots);
        }

        if (totalPages <= 11) {
            for (let i = 0; i < totalPages; i++) addPageButton(i);
        } else {
            addPageButton(0);
            const start = Math.max(1, page - 2);
            const end = Math.min(totalPages - 2, page + 2);

            if (start > 1) addEllipsis();
            for (let i = start; i <= end; i++) addPageButton(i);
            if (end < totalPages - 2) addEllipsis();

            addPageButton(totalPages - 1);
        }

        const next = document.createElement('button');
        next.type = 'button';
        next.className = 'pagination__btn';
        next.innerHTML = '<span class="material-symbols-outlined" style="font-size:1.125rem">expand_more</span>';
        next.title = 'Next page';
        next.disabled = page >= totalPages - 1;
        next.addEventListener('click', () => { questionBankState.page = Math.min(totalPages - 1, page + 1); loadQuestions(); });
        container.appendChild(next);

        const jumpWrap = document.createElement('div');
        jumpWrap.className = 'pagination__jump';
        const jumpInput = document.createElement('input');
        jumpInput.type = 'number';
        jumpInput.min = '1';
        jumpInput.max = String(totalPages);
        jumpInput.placeholder = '#';
        jumpInput.setAttribute('aria-label', 'Jump to page');

        const jumpBtn = document.createElement('button');
        jumpBtn.type = 'button';
        jumpBtn.className = 'btn btn-ghost';
        jumpBtn.textContent = 'Go';

        function goToTypedPage() {
            const raw = (jumpInput.value || '').trim();
            const target = parseInt(raw, 10);
            if (!target || target < 1 || target > totalPages) return;
            questionBankState.page = target - 1;
            loadQuestions();
        }

        jumpBtn.addEventListener('click', goToTypedPage);
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') goToTypedPage();
        });
        jumpWrap.appendChild(jumpInput);
        jumpWrap.appendChild(jumpBtn);
        container.appendChild(jumpWrap);
    }

    async function deleteAllQuestions() {
        if (!window.supabase) {
            alert('Supabase not configured.');
            return;
        }
        if (!confirm('Permanently delete ALL questions and their options from the database? This cannot be undone.')) return;
        const btn = document.getElementById('delete-all-questions-btn');
        if (btn) btn.disabled = true;
        const BATCH = 200;
        let totalDeleted = 0;
        try {
            for (;;) {
                const { data: batch } = await window.supabase.from('questions').select('id').limit(BATCH);
                if (!batch || batch.length === 0) break;
                const ids = batch.map(r => r.id);
                const { error: optErr } = await window.supabase.from('options').delete().in('question_id', ids);
                if (optErr) throw new Error('Options: ' + optErr.message);
                const { error: qErr } = await window.supabase.from('questions').delete().in('id', ids);
                if (qErr) throw new Error('Questions: ' + qErr.message);
                totalDeleted += ids.length;
            }
            questionBankState.totalCount = 0;
            questionBankState.page = 0;
            loadQuestions();
            alert('All ' + totalDeleted + ' question(s) have been deleted.');
        } catch (e) {
            alert('Failed to delete all: ' + (e.message || e));
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    function refreshActiveView() {
        if (activeView === 'flashcards') return loadFlashcards();
        return loadQuestions();
    }

    function setActiveView(next) {
        activeView = next === 'flashcards' ? 'flashcards' : 'mcq';
        const mcqBtn = document.getElementById('view-mcq-btn');
        const flashBtn = document.getElementById('view-flashcards-btn');
        const filters = document.getElementById('mcq-filter-bar');
        const pagination = document.getElementById('pagination-rail');
        const levelFilter = document.getElementById('filter-level');
        const subjectFilter = document.getElementById('filter-subject');
        const topicFilter = document.getElementById('filter-topic');
        const explanationFilter = document.getElementById('filter-explanation');
        const deleteAllBtn = document.getElementById('delete-all-questions-btn');
        const qFeed = document.getElementById('question-feed');
        const qLoading = document.getElementById('question-feed-loading');
        const qEmpty = document.getElementById('question-feed-empty');
        const fFeed = document.getElementById('flashcard-feed');
        const fLoading = document.getElementById('flashcard-feed-loading');
        const fEmpty = document.getElementById('flashcard-feed-empty');

        const isMcq = activeView === 'mcq';
        if (mcqBtn) {
            mcqBtn.classList.toggle('is-active', isMcq);
        }
        if (flashBtn) {
            flashBtn.classList.toggle('is-active', !isMcq);
        }
        if (filters) filters.classList.remove('hidden');
        if (pagination) pagination.classList.toggle('hidden', !isMcq);
        if (levelFilter) levelFilter.classList.toggle('hidden', !isMcq);
        if (subjectFilter) subjectFilter.classList.toggle('hidden', !isMcq);
        if (topicFilter) topicFilter.classList.toggle('hidden', !isMcq);
        if (deleteAllBtn) deleteAllBtn.classList.toggle('hidden', !isMcq);
        if (explanationFilter) explanationFilter.classList.remove('hidden');
        if (qFeed) qFeed.classList.toggle('hidden', !isMcq);
        if (qLoading) qLoading.classList.toggle('hidden', !isMcq);
        if (qEmpty) qEmpty.classList.toggle('hidden', !isMcq);
        if (fFeed) fFeed.classList.toggle('hidden', isMcq);
        if (fLoading) fLoading.classList.toggle('hidden', isMcq);
        if (fEmpty) fEmpty.classList.toggle('hidden', isMcq);
        refreshActiveView();
    }

    function wireFiltersAndSearch() {
        const refetch = () => { questionBankState.page = 0; refreshActiveView(); };
        const elLevel = document.getElementById('filter-level');
        if (elLevel) elLevel.addEventListener('change', refetch);
        const elExplanation = document.getElementById('filter-explanation');
        if (elExplanation) elExplanation.addEventListener('change', refetch);
        const searchEl = document.getElementById('search-questions');
        if (searchEl) searchEl.addEventListener('input', () => { clearTimeout(questionBankState.searchDebounce); questionBankState.searchDebounce = setTimeout(refetch, 300); });
        const deleteAllBtn = document.getElementById('delete-all-questions-btn');
        if (deleteAllBtn) deleteAllBtn.addEventListener('click', deleteAllQuestions);
        const mcqBtn = document.getElementById('view-mcq-btn');
        if (mcqBtn) mcqBtn.addEventListener('click', () => setActiveView('mcq'));
        const flashBtn = document.getElementById('view-flashcards-btn');
        if (flashBtn) flashBtn.addEventListener('click', () => setActiveView('flashcards'));
    }

    function toggleDarkMode() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        const icon = document.getElementById('dark-mode-icon');
        if (icon) icon.textContent = isDark ? 'light_mode' : 'dark_mode';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const isDark = document.documentElement.classList.contains('dark');
        const icon = document.getElementById('dark-mode-icon');
        if (icon) icon.textContent = isDark ? 'light_mode' : 'dark_mode';
        initSubjectAndTopicFilters().finally(() => {
            wireFiltersAndSearch();
            setActiveView('mcq');
        });
    });
</script>
